[package]
name = "magma"
version = "0.1.0"
edition = "2021"

[dependencies]
# Parser combinators for flexible, error-recovering parsing
nom = "7.1"

# Rich, professional error diagnostics with source highlighting
miette = { version = "7.1", features = ["fancy"] }

# Code generation with type-safe template macros
quote = "1.0"
proc-macro2 = "1.0"

# CLI argument parsing
clap = { version = "4.4", features = ["derive"] }

# LLVM IR generation (will add when needed)
# inkwell = { version = "0.6", features = ["llvm14-0"] }

# Serialization for AST/HIR debugging and testing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Temporary file handling for tests
tempfile = "3.8"

[dev-dependencies]
insta = "1.34"  # Snapshot testing for codegen verification

[[bin]]
name = "magma-lex"
path = "src/bin/lex.rs"

[[bin]]
name = "magma-parse"
path = "src/bin/parse.rs"

[[bin]]
name = "magma"
path = "src/main.rs"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
